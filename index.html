:root{--b:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--ok:#16803a;--bad:#c72c41}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:12px;color:var(--muted);background:#e9edf5;padding:7px 10px;border-radius:99px}.card{background:var(--card);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #1d2b4a12}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;touch-action:manipulation}.tab{background:#e7ebf3}.tab.on,.primary{background:var(--b);color:#fff}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#f0f3f8}.choice:disabled{opacity:.9}.choice.correct{background:#dff5e6;color:var(--ok)}.choice.wrong{background:#fde5e8;color:var(--bad)}h1{font-size:23px}h2{font-size:19px;line-height:1.45}.muted{color:var(--muted)}#explain{line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f1f4fa;padding:12px 4px;border-radius:12px}.stat b{display:block;font-size:20px}.warn{background:#fff4ce;padding:12px;border-radius:12px;color:#674d00;display:none}@media(max-width:480px){.wrap{padding:12px}.card{padding:16px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">

</main><script src="day_questions.js"></script><script>

const KEY='toeic-sync-v3'; let state=JSON.parse(localStorage.getItem(KEY)||'{"answers":[]}'), mode='grammar', category='전체 랜덤', current=null, saving,queues={};
const verbs=[['arrive','도착하다','자동사','at'],['discuss','논의하다','타동사',''],['participate','참여하다','자동사','in'],['attend','참석하다','타동사',''],['respond','응답하다','자동사','to'],['approach','접근하다','타동사',''],['complain','불평하다','자동사','about'],['contact','연락하다','타동사',''],['depend','의존하다','자동사','on'],['enter','들어가다','타동사',''],['agree','동의하다','자동사','with'],['reach','도달하다','타동사',''],['refer','언급하다','자동사','to'],['explain','설명하다','타동사',''],['apply','지원하다','자동사','for'],['mention','언급하다','타동사',''],['belong','속하다','자동사','to'],['answer','대답하다','타동사',''],['wait','기다리다','자동사','for'],['visit','방문하다','타동사','']];
const subjects=['The manager','Every applicant','Our sales team','The new employee','Ms. Kim','The committee','All visitors','The technician'];
const objects=['the meeting','the client','the new policy','the main office','the proposal','the request','the conference','the problem'];
let grammar=[];let gid=0;const add=(cat,seeds,count)=>{for(let n=0;n<count;n++){let s=seeds[n%seeds.length],r=Math.floor(n/seeds.length),q=s.q.replaceAll('{S}',subjects[(n+r)%subjects.length]).replaceAll('{O}',objects[(n+r*2)%objects.length]);grammar.push({id:'g'+(++gid),tag:cat,q,c:s.c,a:s.a,e:s.e})}};
const vtSeeds=verbs.map((v,i)=>{const good=v[3]?`${v[0]} ${v[3]}`:v[0],bad=v[3]?v[0]:`${v[0]} ${['to','with','about','at'][i%4]}`;return{q:`{S} will ______ {O} before Friday.`,c:[good,bad,'be '+good,'has '+good],a:0,e:`${v[0]}은(는) ‘${v[1]}’라는 뜻의 ${v[2]}입니다. ${v[3]?`목적어 앞에 전치사 ${v[3]}가 필요합니다.`:'3형식 타동사이므로 목적어를 직접 받으며 불필요한 전치사를 쓰지 않습니다.'}`}});add('자·타동사/전치사',vtSeeds,20);
const formSeeds=[
{q:'The board ______ Mr. Lee the new director.',c:['appointed','arrived','occurred','waited'],a:0,e:'appoint + 목적어 + 목적격보어는 5형식입니다. Mr. Lee = the new director 관계입니다.'},
{q:'The consultant ______ us useful advice.',c:['gave','explained','discussed','said'],a:0,e:'give + 사람 + 사물은 4형식입니다. explain은 explain 사물 to 사람 구조를 씁니다.'},
{q:'The new software ______ easy to use.',c:['seems','makes','gives','explains'],a:0,e:'seem은 2형식 연결동사이며 뒤의 형용사가 주어의 상태를 설명합니다.'},
{q:'The policy will ______ employees to work remotely.',c:['allow','suggest','mention','occur'],a:0,e:'allow + 목적어 + to부정사는 5형식 구조입니다.'},
{q:'The shipment ______ yesterday afternoon.',c:['arrived','reached','delivered','sent'],a:0,e:'arrive는 목적어 없이 쓰이는 1형식 자동사입니다.'}
];add('동사 형식',formSeeds,5);
const compoundSeeds=[
{q:'Please submit the ______ form by Friday.',c:['expense report','expense reporting','expenses report','report expense'],a:0,e:'expense report는 ‘경비 보고서’라는 복합명사입니다. 앞 명사는 보통 단수형으로 뒤 명사를 수식합니다.'},
{q:'The company conducted a customer ______ survey.',c:['satisfaction','satisfied','satisfy','satisfying'],a:0,e:'customer satisfaction survey는 ‘고객 만족도 조사’라는 빈출 복합명사입니다.'},
{q:'All staff must follow the workplace ______ rules.',c:['safety','safe','safely','safer'],a:0,e:'workplace safety rules에서 safety는 명사로 복합명사를 이룹니다.'},
{q:'The marketing team reviewed the sales ______.',c:['figures','figure','figuring','figured'],a:0,e:'sales figures는 ‘매출 수치’라는 복합명사이며 sales가 관용적으로 복수형입니다.'},
{q:'Contact the human ______ department.',c:['resources','resourceful','resource','resourcing'],a:0,e:'human resources department는 ‘인사부’라는 고정 복합명사입니다.'}
];add('복합명사',compoundSeeds,5);
const agreementSeeds=[
{q:'Each of the applicants ______ a résumé.',c:['has submitted','have submitted','submit','submitting'],a:0,e:'each of + 복수명사에서 주어는 each이므로 단수동사 has를 씁니다.'},
{q:'A number of employees ______ attending the seminar.',c:['are','is','was','has'],a:0,e:'a number of + 복수명사는 복수 취급합니다. the number of와 구별하세요.'},
{q:'The number of complaints ______ decreased.',c:['has','have','are','were'],a:0,e:'the number of + 복수명사는 ‘그 수’가 주어이므로 단수 취급합니다.'},
{q:'Neither the manager nor the assistants ______ available.',c:['are','is','was','has'],a:0,e:'neither A nor B는 가까운 주어 B에 수를 일치시킵니다. assistants가 복수이므로 are입니다.'},
{q:'Every invoice and receipt ______ checked carefully.',c:['is','are','have','were'],a:0,e:'every가 각각의 명사를 수식하면 단수로 취급합니다.'}
];add('주어-동사 수일치',agreementSeeds,5);
const tenseSeeds=[
{q:'The company ______ its policy since January.',c:['has revised','revised','will revise','revises'],a:0,e:'since + 과거시점은 과거부터 현재까지의 연결을 나타내므로 현재완료가 적절합니다.'},
{q:'By the time we arrived, the meeting ______.',c:['had begun','has begun','begins','will begin'],a:0,e:'과거의 기준시점보다 먼저 일어난 일은 과거완료로 나타냅니다.'},
{q:'By next Friday, the team ______ the project.',c:['will have completed','completed','has completed','completes'],a:0,e:'by + 미래시점은 그때까지의 완료를 나타내므로 미래완료가 적절합니다.'},
{q:'When the director ______, we will begin.',c:['arrives','will arrive','arrived','has arriving'],a:0,e:'시간 부사절에서는 미래 의미라도 현재시제를 씁니다.'},
{q:'The package ______ yesterday.',c:['was delivered','has delivered','delivers','is delivering'],a:0,e:'명확한 과거시점 yesterday가 있고 수동 관계이므로 과거수동태가 적절합니다.'}
];add('동사 시제',tenseSeeds,5);
const nounSeeds=[
{q:'We need additional ______ about the product.',c:['information','informations','an information','inform'],a:0,e:'information은 불가산명사이므로 복수형이나 부정관사와 함께 쓰지 않습니다.'},
{q:'The manager gave us several useful ______.',c:['suggestions','advice','equipment','furniture'],a:0,e:'several 뒤에는 복수 가산명사가 필요하므로 suggestions가 정답입니다.'},
{q:'There is not ______ time remaining.',c:['much','many','a few','several'],a:0,e:'time이 ‘시간’의 뜻일 때 불가산명사이므로 much와 함께 씁니다.'},
{q:'Only a few ______ attended the workshop.',c:['employees','staff','personnel','equipment'],a:0,e:'a few 뒤에는 복수 가산명사가 필요합니다. employees가 알맞습니다.'},
{q:'The office purchased new ______.',c:['equipment','equipments','an equipment','many equipment'],a:0,e:'equipment는 불가산명사입니다. 개수를 나타내려면 pieces of equipment를 씁니다.'}

const wordBase=[['comply with','~을 준수하다'],['be responsible for','~을 책임지다'],['take part in','~에 참여하다'],['acquaint A with B','A에게 B를 숙지시키다'],['withdraw','철회하다/인출하다'],['verify','확인하다'],['acquisition','인수/취득'],['compensation','보상'],['be accountable for','~에 책임이 있다'],['in honor of','~을 기념하여'],['respond to','~에 응답하다'],['be responsive to','~에 잘 반응하다'],['be equipped with','~을 갖추다'],['collaborate with','~와 협력하다'],['as of today','오늘부로'],['be intended for','~을 위한 것이다'],['have difficulty -ing','~하는 데 어려움을 겪다'],['be eligible for','~할 자격이 있다'],['in accordance with','~에 따라'],['on behalf of','~을 대신하여']];
const words=wordBase.map((w,i)=>({id:'w'+i,tag:'내 단어장',q:`다음 표현의 뜻은?  “${w[0]}”`,c:[w[1],wordBase[(i+7)%20][1],wordBase[(i+11)%20][1],wordBase[(i+15)%20][1]],a:0,e:`${w[0]} = ${w[1]}`}));
function shuffleQ(q){let idx=q.c.map((_,i)=>i).sort(()=>Math.random()-.5);return {...q,c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)}}
function unique(list){let seen=new Set;return list.filter(x=>{let k=x.q.toLowerCase().replace(/[^a-z0-9가-힣]+/g,' ').trim();if(seen.has(k))return false;seen.add(k);return true})}
function pool(){if(mode==='words')return words;if(mode.startsWith('day'))return dayQuestions.filter(x=>x.day===`DAY ${mode.slice(3)}`);if(mode==='weak'){let wrongIds=[...new Set(state.answers.filter(x=>!x.ok).map(x=>x.id))],all=grammar.concat(dayQuestions,words),p=all.filter(x=>wrongIds.includes(x.id));return p.length?p:grammar.concat(dayQuestions)}return category==='전체 랜덤'?grammar:grammar.filter(x=>x.tag===category)}
function next(){let p=unique(pool()),key=mode==='grammar'?mode+category:mode;if(!queues[key]||!queues[key].length)queues[key]=p.map((_,i)=>i).sort(()=>Math.random()-.5);current=shuffleQ(p[queues[key].shift()]);document.querySelector('#meta').textContent=`${current.day?current.day+' · ':''}${current.tag} · ${current.id}`;document.querySelector('#question').textContent=current.q;let box=document.querySelector('#choices');box.innerHTML='';current.c.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>answer(i);box.appendChild(b)});document.querySelector('#explain').innerHTML='';document.querySelector('#next').hidden=true;document.querySelector('#ask').hidden=true}
function answer(i){document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===current.a)b.classList.add('correct');if(j===i&&i!==current.a)b.classList.add('wrong')});let ok=i===current.a;state.answers.push({id:current.id,selected:i,ok,tag:current.tag,at:new Date().toISOString()});persist();document.querySelector('#explain').innerHTML=`<p><b>${ok?'정답이에요.':'오답이에요.'}</b> ${current.e}</p>`;document.querySelector('#next').hidden=false;document.querySelector('#ask').hidden=false;renderStats()}
function renderStats(){let n=state.answers.length, ok=state.answers.filter(x=>x.ok).length;answered.textContent=n;rate.textContent=n?Math.round(ok/n*100)+'%':'0%';wrong.textContent=n-ok;let c={};state.answers.filter(x=>!x.ok).forEach(x=>c[x.tag]=(c[x.tag]||0)+1);weakness.textContent=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>`${x[0]} ${x[1]}회`).join(' · ')||'아직 기록이 없어요.'}
function token(){let m=location.hash.match(/(?:^#|&)sync=([A-Za-z0-9_-]{16,})/);return m&&m[1]}
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rpc(name,body){let r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function initSync(){if(SUPABASE_URL.startsWith('YOUR_')){warn.style.display='block';warn.textContent='배포 전 index.html의 Supabase Project URL을 입력해야 클라우드 동기화가 켜집니다.';sync.textContent='로컬 저장 중';return}let t=token();if(!t){t=crypto.randomUUID().replaceAll('-','')+crypto.randomUUID().replaceAll('-','');location.hash='sync='+t}try{let h=await hash(t), remote=await rpc('toeic_pull',{p_token_hash:h});if(remote&&remote.answers&&remote.answers.length>state.answers.length)state=remote;else if(state.answers.length)await rpc('toeic_push',{p_token_hash:h,p_state:state});localStorage.setItem(KEY,JSON.stringify(state));sync.textContent='클라우드 동기화됨';renderStats()}catch(e){sync.textContent='오프라인 저장 중';warn.style.display='block';warn.textContent='Supabase 연결을 확인해 주세요. 이 기기에는 계속 저장됩니다.'}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));clearTimeout(saving);saving=setTimeout(async()=>{let t=token();if(!t||SUPABASE_URL.startsWith('YOUR_'))return;try{await rpc('toeic_push',{p_token_hash:await hash(t),p_state:state});sync.textContent='클라우드 동기화됨'}catch{sync.textContent='오프라인 저장 중'}},350)}
document.querySelector('#category').onchange=e=>{category=e.target.value;mode='grammar';queues={};document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('on',i===0));categoryBox.style.display='block';next()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;categoryBox.style.display=mode==='grammar'?'block':'none';next()});document.querySelector('#next').onclick=next;document.querySelector('#ask').onclick=async()=>{let s=`TOEIC 문제: ${current.q}\n선택지: ${current.c.join(' / ')}\n정답: ${current.c[current.a]}\n해설: ${current.e}\n쉽게 설명해줘.`;await navigator.clipboard.writeText(s);window.open('https://chatgpt.com/','_blank')};document.querySelector('#reset').onclick=()=>{if(confirm('이 기기의 기록을 초기화할까요? 클라우드에도 반영됩니다.')){state={answers:[]};persist();renderStats();next()}};renderStats();next();initSync();
</script></body></html>
