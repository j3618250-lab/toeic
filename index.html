<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14213d"><title>TOEIC FINAL — 전수 문제은행</title>
<style>:root{--ink:#14213d;--blue:#2457d6;--bg:#f3f6fb;--card:#fff;--muted:#68758b;--line:#dfe5ef;--ok:#08783e;--bad:#bd2636}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:860px;margin:auto;padding:14px}.hero{padding:18px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:14px}.hero h1{font-size:23px;margin:0 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.badge{background:#e7edff;color:#244bb4;border-radius:99px;padding:7px 10px;font-size:12px;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 8px 24px #19335b0a}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tab,button,select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-weight:750;color:var(--ink)}button{cursor:pointer}.tab.on,.primary{background:var(--blue);color:white;border-color:var(--blue)}select{width:100%;font-size:15px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f6f8fc;border-radius:12px;padding:10px;text-align:center;font-size:11px;color:var(--muted)}.stat b{display:block;color:var(--ink);font-size:18px}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.vs{color:#244bb4;font-weight:800}.question{font-size:22px;line-height:1.52;margin:18px 0}.choice{width:100%;text-align:left;margin:7px 0;background:#f7f9fc;font-size:15px}.choice.correct{background:#e2f6e9;border-color:#7bc99b;color:var(--ok)}.choice.wrong{background:#fde7ea;border-color:#ee9ba5;color:var(--bad)}.choice:disabled{opacity:1}.feedback{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}.ex{padding:12px 0;border-bottom:1px dashed var(--line);line-height:1.65}.ex:last-child{border:0}.ex b{display:block;font-size:13px;margin-bottom:3px}.weak-list{display:grid;gap:8px}.weak-item{display:flex;justify-content:space-between;background:#f6f8fc;padding:10px 12px;border-radius:10px}.concept-grid{display:grid;gap:12px}.concept{border:1px solid var(--line);border-radius:14px;padding:14px}.concept h3{margin:0 0 5px;font-size:17px}.concept p{margin:0 0 9px;color:var(--muted);line-height:1.55}.concept ul{margin:7px 0;padding-left:21px;line-height:1.6}.concept .examples{background:#f6f8fc;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.6}.empty{color:var(--muted);text-align:center;padding:22px}.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px}.hidden{display:none!important}@media(max-width:540px){.wrap{padding:10px}.card{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.question{font-size:19px}}</style></head><body><main class="wrap"><header class="hero"><div><h1>TOEIC FINAL</h1><p>사진 전수 반영 · 중복 제거 · 오답 집중 학습</p></div><span class="badge" id="count"></span></header>
<section class="card"><div class="tabs"><button class="tab on" data-mode="all">전체 랜덤</button><button class="tab" data-mode="vocab">사진 단어</button><button class="tab" data-mode="collocation">콜로케이션</button><button class="tab" data-mode="notegrammar">사진 문법</button><button class="tab" data-mode="concepts">개념 정리</button><button class="tab" data-mode="day1">DAY 1</button><button class="tab" data-mode="day2">DAY 2</button><button class="tab" data-mode="day3">DAY 3</button><button class="tab" data-mode="starred">★ 별표</button><button class="tab" data-mode="bad">Bad</button><button class="tab" data-mode="wrong">오답 랜덤</button><button class="tab" data-mode="weak">취약유형</button></div><div id="filterWrap" style="margin-top:12px"><select id="category"><option value="all">모든 카테고리</option></select></div></section>
<section class="card"><div class="stats"><div class="stat"><b id="done">0</b>풀이</div><div class="stat"><b id="rate">0%</b>정답률</div><div class="stat"><b id="wrongN">0</b>누적 오답</div><div class="stat"><b id="left">0</b>현재 묶음</div></div></section>
<section class="card" id="quiz"><div class="meta"><span class="vs" id="label"></span><span id="progress"></span></div><div class="question" id="question"></div><div id="choices"></div><div id="feedback" class="feedback hidden"></div><div class="row" style="margin-top:14px"><button id="prevBtn">‹ 이전</button><button class="primary" id="nextBtn">다음 ›</button><button id="starBtn">☆ 별표</button><button id="badBtn">Bad</button><button id="copyBadBtn">BAD 목록 복사</button></div></section>
<section class="card hidden" id="conceptPane"><h2 style="margin-top:0">사진 속 개념 정리</h2><p style="color:var(--muted)">규칙과 예문을 함께 보고, 뜻이 갈리는 표현은 차이를 비교하세요.</p><div id="conceptList" class="concept-grid"></div></section><section class="card hidden" id="weakPane"><h2 style="margin-top:0">취약유형 누적 정리</h2><div id="weakList" class="weak-list"></div></section><section class="card"><button id="resetBtn">이 기기의 기록 초기화</button></section><div class="footer">로그인 없이 이 기기에만 안전하게 저장됩니다.</div></main>
<script src="day_questions.js?v=27"></script><script src="day_translations.js?v=27"></script><script src="questions.js?v=27"></script><script src="restored_core_questions.js?v=27"></script><script src="vocab_questions.js?v=27"></script><script src="note_grammar_questions.js?v=27"></script><script src="collocation_questions.js?v=27"></script><script src="notion_collocation_questions.js?v=27"></script><script src="concept_questions.js?v=27"></script><script src="concepts.js?v=27"></script><script>
const KEY='toeic-final-v5';let state=JSON.parse(localStorage.getItem(KEY)||'{"answers":[]}');state.answers||=[];state.badIds||=[];state.starIds||=[];state.seen||={};let mode='all',selectedCategory='all',queue=[],current=null,answered=false,backStack=[],forwardStack=[];const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(state))}function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function seenRank(id){let x=state.seen[id]||{count:0,last:0};return[x.count,x.last]}function leastSeen(ids){return shuffle([...ids]).sort((a,b)=>{let A=seenRank(a),B=seenRank(b);return A[0]-B[0]||A[1]-B[1]})}
const DAY_BANK=dayQuestions.map(q=>({id:q.id,day:q.day,category:q.day,label:'',q:q.q,choices:q.c,answer:q.a,translation:DAY_TRANSLATIONS[q.id]||'번역을 확인 중입니다.',why:q.e,wrong:'각 선택지는 품사·문장 구조·문맥 또는 고정 결합을 기준으로 비교하세요.',memory:'정답 단어만 외우지 말고 완성 문장과 연어 단위로 암기하세요.',source:'기존 DAY 1~3 원문'}));
const RESTORED_CORE_BANK=RESTORED_CORE_QUESTIONS,VOCAB_BANK=VOCAB_QUESTIONS,NOTE_GRAMMAR_BANK=NOTE_GRAMMAR_QUESTIONS,COLLOCATION_BANK=[...COLLOCATION_QUESTIONS,...NOTION_COLLOCATION_QUESTIONS],CONCEPT_QUESTION_BANK=CONCEPT_QUESTIONS;
const ALL_QUESTIONS=[...QUESTIONS,...RESTORED_CORE_BANK,...DAY_BANK,...VOCAB_BANK,...NOTE_GRAMMAR_BANK,...COLLOCATION_BANK,...CONCEPT_QUESTION_BANK],byId=new Map(ALL_QUESTIONS.map(q=>[q.id,q]));[...new Set(ALL_QUESTIONS.map(q=>q.category))].sort().forEach(c=>$('#category').insertAdjacentHTML('beforeend',`<option>${c}</option>`));$('#count').textContent=`${ALL_QUESTIONS.length}문항`;
function pool(){let p=ALL_QUESTIONS;if(mode==='vocab')p=VOCAB_BANK;if(mode==='collocation')p=COLLOCATION_BANK;if(mode==='notegrammar')p=NOTE_GRAMMAR_BANK;if(mode.startsWith('day'))p=DAY_BANK.filter(x=>x.day===`DAY ${mode.slice(3)}`);if(mode==='starred')p=state.starIds.map(x=>byId.get(x)).filter(Boolean);if(mode==='bad')p=state.badIds.map(x=>byId.get(x)).filter(Boolean);if(mode==='wrong'){let ids=[...new Set(state.answers.filter(x=>!x.ok).map(x=>x.id))];p=ids.map(x=>byId.get(x)).filter(Boolean)}if(mode==='all'&&selectedCategory!=='all')p=p.filter(x=>x.category===selectedCategory);if(mode!=='bad')p=p.filter(x=>!state.badIds.includes(x.id));return p}function refill(){if(mode==='all'&&selectedCategory!=='all'&&pool().length<=1){selectedCategory='all';$('#category').value='all'}if(mode==='vocab'||mode==='collocation'){let vb=pool(),pairs=[...new Set(vb.map(x=>x.pairId))];pairs=shuffle(pairs).sort((a,b)=>{let ai=vb.filter(x=>x.pairId===a).map(x=>x.id),bi=vb.filter(x=>x.pairId===b).map(x=>x.id),ac=ai.reduce((n,id)=>n+seenRank(id)[0],0),bc=bi.reduce((n,id)=>n+seenRank(id)[0],0),al=Math.max(...ai.map(id=>seenRank(id)[1])),bl=Math.max(...bi.map(id=>seenRank(id)[1]));return ac-bc||al-bl});queue=pairs.flatMap(id=>vb.filter(x=>x.pairId===id).sort((a,b)=>a.stage-b.stage).map(x=>x.id)).reverse()}else queue=leastSeen(pool().map(x=>x.id)).reverse();$('#left').textContent=queue.length}
function drawQuestion(recordSeen=true){if(!queue.length)refill();current=byId.get(queue.pop());$('#left').textContent=queue.length+(current?1:0);answered=false;if(current&&recordSeen){let v=state.seen[current.id]||{count:0,last:0};state.seen[current.id]={count:v.count+1,last:Date.now()};save()}$('#prevBtn').disabled=backStack.length===0;if(!current){$('#label').textContent='';$('#progress').textContent='오답 랜덤';$('#question').textContent='아직 오답이 없습니다. 전체 랜덤에서 문제를 풀어보세요.';$('#choices').innerHTML='';$('#feedback').classList.add('hidden');$('#nextBtn').classList.add('hidden');return}$('#nextBtn').classList.remove('hidden');$('#label').textContent=current.label||'';$('#starBtn').textContent=state.starIds.includes(current.id)?'★ 별표됨':'☆ 별표';$('#badBtn').textContent=state.badIds.includes(current.id)?'Bad 해제':'Bad';$('#progress').textContent=`${current.category} · ${current.id}`;$('#question').textContent=current.q;$('#choices').innerHTML='';$('#feedback').classList.add('hidden');current.choices.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>answer(i);$('#choices').appendChild(b)});renderStats()}
function nextQuestion(){if(forwardStack.length){if(current)backStack.push(current.id);queue.push(forwardStack.pop());drawQuestion(false);return}if(current)backStack.push(current.id);drawQuestion()}
function prevQuestion(){if(!backStack.length)return;if(current)forwardStack.push(current.id);queue.push(backStack.pop());drawQuestion(false)}
function answer(i){if(answered)return;answered=true;let ok=i===current.answer;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===current.answer)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong')});state.answers.push({id:current.id,ok,category:current.category,at:Date.now()});save();$('#feedback').innerHTML=`<div class="ex"><b>${ok?'정답입니다':'오답입니다'} — ${'ABCD'[current.answer]}. ${current.choices[current.answer]}</b></div><div class="ex"><b>문장 전체 해석</b>${current.translation}</div><div class="ex"><b>정답 이유</b>${current.why}</div><div class="ex"><b>선택지별 이유</b>${(current.wrongReasons||current.choices.map((c,j)=>`${"ABCD"[j]}. ${c}: ${j===current.answer?"문장 구조와 의미를 모두 충족하는 정답입니다.":current.wrong}`)).map(x=>`<div style="margin:7px 0">${x}</div>`).join("")}</div><div class="ex"><b>관련 암기 문법·연어</b>${current.memory}</div>`;$('#feedback').classList.remove('hidden');renderStats()}
function renderStats(){let n=state.answers.length,ok=state.answers.filter(x=>x.ok).length;$('#done').textContent=n;$('#rate').textContent=n?Math.round(ok/n*100)+'%':'0%';$('#wrongN').textContent=n-ok;let c={};state.answers.filter(x=>!x.ok).forEach(x=>c[x.category]=(c[x.category]||0)+1);$('#weakList').innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="weak-item"><span>${k}</span><b>${v}회</b></div>`).join('')||'<div class="empty">아직 누적된 취약유형이 없습니다.</div>'}
$('#conceptList').innerHTML=PHOTO_CONCEPTS.map(c=>`<article class="concept"><h3>${c.title}</h3><p>${c.summary}</p><ul>${c.rules.map(x=>`<li>${x}</li>`).join('')}</ul><div class="examples"><b>예시</b><br>${c.examples.join('<br>')}</div></article>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{$('#conceptList').innerHTML=PHOTO_CONCEPTS.map(c=>`<article class="concept"><h3>${c.title}</h3><p>${c.summary}</p><ul>${c.rules.map(x=>`<li>${x}</li>`).join('')}</ul><div class="examples"><b>예시</b><br>${c.examples.join('<br>')}</div></article>`).join('');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;if(mode==='all'){selectedCategory='all';$('#category').value='all'}backStack=[];forwardStack=[];current=null;$('#weakPane').classList.toggle('hidden',mode!=='weak');$('#quiz').classList.toggle('hidden',mode==='weak');$('#filterWrap').classList.toggle('hidden',mode!=='all');queue=[];renderStats();if(mode!=='weak'&&mode!=='concepts')nextQuestion()});$('#category').onchange=e=>{selectedCategory=e.target.value;queue=[];nextQuestion()};$('#starBtn').onclick=()=>{if(!current)return;let i=state.starIds.indexOf(current.id);if(i<0)state.starIds.push(current.id);else state.starIds.splice(i,1);save();$('#starBtn').textContent=i<0?'★ 별표됨':'☆ 별표'};
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{$('#conceptPane').classList.toggle('hidden',b.dataset.mode!=='concepts');$('#quiz').classList.toggle('hidden',b.dataset.mode==='weak'||b.dataset.mode==='concepts')}));
$('#badBtn').onclick=()=>{if(!current)return;let i=state.badIds.indexOf(current.id);if(i<0)state.badIds.push(current.id);else state.badIds.splice(i,1);save();if(mode==='bad'){queue=[];nextQuestion()}else if(i<0)nextQuestion();else $('#badBtn').textContent='Bad'};
$('#copyBadBtn').onclick=async()=>{let items=state.badIds.map(id=>byId.get(id)).filter(Boolean),text=items.map(q=>`[${q.id}] ${q.category}\n${q.q}\n정답: ${q.choices[q.answer]}`).join('\n\n');if(!text){alert('표시된 BAD 문제가 없습니다.');return}try{await navigator.clipboard.writeText(text);$('#copyBadBtn').textContent='복사 완료';setTimeout(()=>$('#copyBadBtn').textContent='BAD 목록 복사',1200)}catch(e){prompt('아래 목록을 복사하세요.',text)}};
$('#prevBtn').onclick=prevQuestion;$('#nextBtn').onclick=nextQuestion;$('#resetBtn').onclick=()=>{if(confirm('이 기기의 학습 기록을 초기화할까요?')){state={answers:[]};save();queue=[];renderStats();location.reload()}};renderStats();nextQuestion();
</script></body></html>
