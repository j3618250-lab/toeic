<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOEIC 훈련</title><style>
:root{--b:#2563eb;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#687386;--ok:#16803a;--bad:#c72c41}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:12px;color:var(--muted);background:#e9edf5;padding:7px 10px;border-radius:99px}.card{background:var(--card);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #1d2b4a12}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;touch-action:manipulation}.tab{background:#e7ebf3}.tab.on,.primary{background:var(--b);color:#fff}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#f0f3f8}.choice:disabled{opacity:.9}.choice.correct{background:#dff5e6;color:var(--ok)}.choice.wrong{background:#fde5e8;color:var(--bad)}h1{font-size:23px}h2{font-size:19px;line-height:1.45}.muted{color:var(--muted)}#explain{line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;background:#f1f4fa;padding:12px 4px;border-radius:12px}.stat b{display:block;font-size:20px}.warn{background:#fff4ce;padding:12px;border-radius:12px;color:#674d00;display:none}@media(max-width:480px){.wrap{padding:12px}.card{padding:16px}.stats{grid-template-columns:1fr 1fr}}
</style></head><body><main class="wrap">
<div class="top"><h1>TOEIC 훈련</h1><span class="pill" id="sync">동기화 확인 중…</span></div>
<div id="warn" class="warn"></div>
<div class="tabs"><button class="tab on" data-mode="grammar">문법 620+</button><button class="tab" data-mode="words">📖 내 단어장</button><button class="tab" data-mode="weak">취약점 우선</button></div>
<section class="card"><div class="stats"><div class="stat"><b id="answered">0</b>풀이</div><div class="stat"><b id="rate">0%</b>정답률</div><div class="stat"><b id="wrong">0</b>오답</div></div></section>
<section class="card"><div class="muted" id="meta"></div><h2 id="question">문제를 준비하고 있어요…</h2><div id="choices"></div><div id="explain"></div><div class="actions"><button class="primary" id="next" hidden>다음 문제</button><button id="ask" hidden>ChatGPT에게 질문</button></div></section>
<section class="card"><b>취약 유형</b><p id="weakness" class="muted">아직 기록이 없어요.</p><button id="reset">이 기기의 기록 초기화</button></section>
</main><script>
const SUPABASE_URL='https://kffydlqfurugconevlmc.supabase.co';
const SUPABASE_KEY='sb_publishable_VYZpKvuHnhZk67R0I6UC8w_lauR-dfV';
const KEY='toeic-sync-v3'; let state=JSON.parse(localStorage.getItem(KEY)||'{"answers":[]}'), mode='grammar', current=null, saving;
const verbs=[['arrive','도착하다','자동사','at'],['discuss','논의하다','타동사',''],['participate','참여하다','자동사','in'],['attend','참석하다','타동사',''],['respond','응답하다','자동사','to'],['approach','접근하다','타동사',''],['complain','불평하다','자동사','about'],['contact','연락하다','타동사',''],['depend','의존하다','자동사','on'],['enter','들어가다','타동사',''],['agree','동의하다','자동사','with'],['reach','도달하다','타동사',''],['refer','언급하다','자동사','to'],['explain','설명하다','타동사',''],['apply','지원하다','자동사','for'],['mention','언급하다','타동사',''],['belong','속하다','자동사','to'],['answer','대답하다','타동사',''],['wait','기다리다','자동사','for'],['visit','방문하다','타동사','']];
const subjects=['The manager','Every applicant','Our sales team','The new employee','Ms. Kim','The committee','All visitors','The technician'];
const objects=['the meeting','the client','the new policy','the main office','the proposal','the request','the conference','the problem'];
let grammar=[];let gid=0;for(let round=0;round<4;round++)for(const v of verbs)for(let i=0;i<subjects.length;i++){const prep=v[3], good=prep?`${v[0]} ${prep}`:v[0], bad=prep?v[0]:`${v[0]} ${['to','with','about','at'][i%4]}`;grammar.push({id:'g'+(++gid),tag:v[2],q:`${subjects[i]} will ______ ${objects[(i+round)%objects.length]} before Friday.`,c:[good,bad,'be '+good,'has '+good],a:0,e:`${v[0]}은(는) ‘${v[1]}’라는 뜻의 ${v[2]}입니다.${prep?' 뒤에 '+prep+'가 필요합니다.':' 목적어 앞에 전치사를 쓰지 않습니다.'}`})}
const wordBase=[['comply with','~을 준수하다'],['be responsible for','~을 책임지다'],['take part in','~에 참여하다'],['acquaint A with B','A에게 B를 숙지시키다'],['withdraw','철회하다/인출하다'],['verify','확인하다'],['acquisition','인수/취득'],['compensation','보상'],['be accountable for','~에 책임이 있다'],['in honor of','~을 기념하여'],['respond to','~에 응답하다'],['be responsive to','~에 잘 반응하다'],['be equipped with','~을 갖추다'],['collaborate with','~와 협력하다'],['as of today','오늘부로'],['be intended for','~을 위한 것이다'],['have difficulty -ing','~하는 데 어려움을 겪다'],['be eligible for','~할 자격이 있다'],['in accordance with','~에 따라'],['on behalf of','~을 대신하여']];
const words=wordBase.map((w,i)=>({id:'w'+i,tag:'내 단어장',q:`다음 표현의 뜻은?  “${w[0]}”`,c:[w[1],wordBase[(i+7)%20][1],wordBase[(i+11)%20][1],wordBase[(i+15)%20][1]],a:0,e:`${w[0]} = ${w[1]}`}));
function shuffleQ(q){let idx=q.c.map((_,i)=>i).sort(()=>Math.random()-.5);return {...q,c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)}}
function pool(){if(mode==='words')return words;if(mode==='weak'){let counts={};state.answers.filter(x=>!x.ok).forEach(x=>counts[x.tag]=(counts[x.tag]||0)+1);let tags=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).slice(0,3);return grammar.filter(x=>tags.includes(x.tag)).concat(words.filter(x=>tags.includes(x.tag))).length?grammar.filter(x=>tags.includes(x.tag)).concat(words.filter(x=>tags.includes(x.tag))):grammar}return grammar}
function next(){current=shuffleQ(pool()[Math.floor(Math.random()*pool().length)]);document.querySelector('#meta').textContent=`${current.tag} · ${current.id}`;document.querySelector('#question').textContent=current.q;let box=document.querySelector('#choices');box.innerHTML='';current.c.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>answer(i);box.appendChild(b)});document.querySelector('#explain').innerHTML='';document.querySelector('#next').hidden=true;document.querySelector('#ask').hidden=true}
function answer(i){document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===current.a)b.classList.add('correct');if(j===i&&i!==current.a)b.classList.add('wrong')});let ok=i===current.a;state.answers.push({id:current.id,selected:i,ok,tag:current.tag,at:new Date().toISOString()});persist();document.querySelector('#explain').innerHTML=`<p><b>${ok?'정답이에요.':'오답이에요.'}</b> ${current.e}</p>`;document.querySelector('#next').hidden=false;document.querySelector('#ask').hidden=false;renderStats()}
function renderStats(){let n=state.answers.length, ok=state.answers.filter(x=>x.ok).length;answered.textContent=n;rate.textContent=n?Math.round(ok/n*100)+'%':'0%';wrong.textContent=n-ok;let c={};state.answers.filter(x=>!x.ok).forEach(x=>c[x.tag]=(c[x.tag]||0)+1);weakness.textContent=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>`${x[0]} ${x[1]}회`).join(' · ')||'아직 기록이 없어요.'}
function token(){let m=location.hash.match(/(?:^#|&)sync=([A-Za-z0-9_-]{16,})/);return m&&m[1]}
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rpc(name,body){let r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
async function initSync(){if(SUPABASE_URL.startsWith('YOUR_')){warn.style.display='block';warn.textContent='배포 전 index.html의 Supabase Project URL을 입력해야 클라우드 동기화가 켜집니다.';sync.textContent='로컬 저장 중';return}let t=token();if(!t){t=crypto.randomUUID().replaceAll('-','')+crypto.randomUUID().replaceAll('-','');location.hash='sync='+t}try{let h=await hash(t), remote=await rpc('toeic_pull',{p_token_hash:h});if(remote&&remote.answers&&remote.answers.length>state.answers.length)state=remote;else if(state.answers.length)await rpc('toeic_push',{p_token_hash:h,p_state:state});localStorage.setItem(KEY,JSON.stringify(state));sync.textContent='클라우드 동기화됨';renderStats()}catch(e){sync.textContent='오프라인 저장 중';warn.style.display='block';warn.textContent='Supabase 연결을 확인해 주세요. 이 기기에는 계속 저장됩니다.'}}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));clearTimeout(saving);saving=setTimeout(async()=>{let t=token();if(!t||SUPABASE_URL.startsWith('YOUR_'))return;try{await rpc('toeic_push',{p_token_hash:await hash(t),p_state:state});sync.textContent='클라우드 동기화됨'}catch{sync.textContent='오프라인 저장 중'}},350)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');mode=b.dataset.mode;next()});document.querySelector('#next').onclick=next;document.querySelector('#ask').onclick=async()=>{let s=`TOEIC 문제: ${current.q}\n선택지: ${current.c.join(' / ')}\n정답: ${current.c[current.a]}\n해설: ${current.e}\n쉽게 설명해줘.`;await navigator.clipboard.writeText(s);window.open('https://chatgpt.com/','_blank')};document.querySelector('#reset').onclick=()=>{if(confirm('이 기기의 기록을 초기화할까요? 클라우드에도 반영됩니다.')){state={answers:[]};persist();renderStats();next()}};renderStats();next();initSync();
</script></body></html>
