function shuffleQ(q){let idx=q.c.map((_,i)=>i).sort(()=>Math.random()-.5);return {...q,c:idx.map(i=>q.c[i]),a:idx.indexOf(q.a)}}
function unique(list){let seen=new Set;return list.filter(x=>{let k=x.q.toLowerCase().replace(/[^a-z0-9가-힣]+/g,' ').trim();if(seen.has(k))return false;seen.add(k);return true})}
function pool(){if(mode==='words')return words;if(mode.startsWith('day'))return dayQuestions.filter(x=>x.day===`DAY ${mode.slice(3)}`);if(mode==='weak'){let wrongIds=[...new Set(state.answers.filter(x=>!x.ok).map(x=>x.id))],all=grammar.concat(dayQuestions,words),p=all.filter(x=>wrongIds.includes(x.id));return p.length?p:grammar.concat(dayQuestions)}return category==='전체 랜덤'?grammar:grammar.filter(x=>x.tag===category)}
function next(){let p=unique(pool()),key=mode==='grammar'?mode+category:mode;if(!queues[key]||!queues[key].length)queues[key]=p.map((_,i)=>i).sort(()=>Math.random()-.5);current=shuffleQ(p[queues[key].shift()]);document.querySelector('#meta').textContent=current.concept?`${current.tag} · 개념 학습`:`${current.day||current.tag} · ${current.id}`;document.querySelector('#question').textContent=current.q;let box=document.querySelector('#choices');box.innerHTML='';document.querySelector('#explain').innerHTML='';if(current.concept){document.querySelector('#explain').innerHTML=`<div class="concept"><b>잠깐, 개념을 잡고 가요</b><br>${current.e}</div>`;document.querySelector('#next').hidden=false;document.querySelector('#ask').hidden=true;return}current.c.forEach((c,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${c}`;b.onclick=()=>answer(i);box.appendChild(b)});document.querySelector('#next').hidden=true;document.querySelector('#ask').hidden=true}

function renderStats(){let n=state.answers.length, ok=state.answers.filter(x=>x.ok).length;answered.textContent=n;rate.textContent=n?Math.round(ok/n*100)+'%':'0%';wrong.textContent=n-ok;let c={};state.answers.filter(x=>!x.ok).forEach(x=>c[x.tag]=(c[x.tag]||0)+1);weakness.textContent=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>`${x[0]} ${x[1]}회`).join(' · ')||'아직 기록이 없어요.'}
function token(){let m=location.hash.match(/(?:^#|&)sync=([A-Za-z0-9_-]{16,})/);return m&&m[1]}
async function hash(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function rpc(name,body){let r=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}
